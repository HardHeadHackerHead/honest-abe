name: CI

# Checks every pull request and every push to main. Uses no secrets, so it is
# safe for pull requests from forks. Never switch this to pull_request_target.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Test
        run: npm test --if-present

  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Local Whisper (whisper-rs) builds whisper.cpp with CMake and needs
      # libclang for bindgen. The Windows and macOS runners ship both.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libasound2-dev libxdo-dev libx11-dev libxi-dev libxtst-dev \
            libdbus-1-dev pkg-config cmake clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs frontendDist (../dist) to exist at
      # compile time. The frontend job builds the real UI; a placeholder page
      # is enough to compile and test the Rust side.
      - name: Create placeholder frontend build
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The updater code is compiled only into official releases; lint it too.
      - name: Clippy (updater feature)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features updater -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
