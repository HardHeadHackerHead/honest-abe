name: Feature request
description: Suggest an idea or improvement for Abe
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the [existing issues](https://github.com/HardHeadHackerHead/honest-abe/issues) first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation and hotkeys
        - Local engine (Whisper)
        - Cloud providers
        - Transform
        - History, dictionary or stats
        - Settings and UI
        - Platform support (Linux, macOS, Windows)
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
